openapi: 3.1.0
info:
  title: GDFinances Assistant API
  version: 0.1.0
  description: Endpoints de consulta financeira autenticados do GDFinances.
servers:
  - url: https://gdfinances-git-feat-chatgpt-finance-api-gabriellsds-projects.vercel.app
security:
  - BearerAuth: []
paths:
  /api/assistant/summary:
    get:
      operationId: getFinancialSummary
      summary: Consultar resumo do mês atual e do próximo mês
      responses:
        "200":
          description: Contas, receitas, despesas pagas e pendentes dos períodos.
        "401":
          description: Token Supabase ausente, inválido ou expirado.
  /api/assistant/transactions:
    get:
      operationId: listFinancialTransactions
      summary: Listar lançamentos financeiros
      parameters:
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
        - in: query
          name: status
          schema: { type: string, enum: [paid, pending] }
        - in: query
          name: type
          schema: { type: string, enum: [income, expense] }
      responses:
        "200":
          description: Lançamentos encontrados.
        "401":
          description: Token Supabase ausente, inválido ou expirado.
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Supabase access token
